name: Release Package

# need to setup:
# secrets.PYPI_API_TOKEN (See: https://pypi.org/help/#apitoken)
# secrets.TESTPYPI_API_TOKEN (See: https://test.pypi.org/help/#apitoken)

on:
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        install_args: java uv
    - name: Publish package
      run: mise run publish
      env:
        TESTPYPI_API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
