[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "openapi-generator-cli"
version = "0"
description = "CLI for openapi generator"
readme = "README.md"
keywords = [
  "cli",
  "generator",
  "openapi",
]
license = { text = "APACHE 2.0" }
authors = [ { name = "OpenAPI Generator community", email = "team@openapitools.org" } ]
requires-python = ">=3.10,<4"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Typing :: Typed",
]
dependencies = []
optional-dependencies.jdk4py = [ "jdk4py>=21.0.4.1,<26; python_version>='3.10'" ]
urls.Documentation = "https://github.com/OpenAPITools/openapi-generator#3---usage"
urls.Homepage = "https://openapi-generator.tech"
urls.Repository = "https://github.com/OpenAPITools/openapi-generator"
scripts.openapi-generator-cli = "openapi_generator_cli:cli"

[dependency-groups]
dev = [
  "natsort>=8.4,<9",
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.6,<3",
  "pytest>=7.2.2,<10",
  "pytest-cov>=6",
]

[tool.hatch]
build.targets.wheel.include = [
  "openapi_generator_cli",
]
build.targets.wheel.artifacts = [
  "openapi_generator_cli/openapi-generator.jar",
]
build.targets.sdist.include = [
  "openapi_generator_cli",
]
build.targets.sdist.artifacts = [
  "openapi_generator_cli/openapi-generator.jar",
]

[tool.uv]
default-groups = [ "dev" ]

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY001", # Missing copyright notice at top of file
  "D211",   # No blank lines allowed before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
]
lint.per-file-ignores."publish.py" = [
  "D",
  "S603", # `subprocess` call: check for execution of untrusted input
  "T201", # `print` found
]
lint.per-file-ignores."tests/*" = [
  "D",
  "S101", # Use of `assert` detected
]
lint.pydocstyle.convention = "google"

[tool.pymarkdown]
plugins.md013.enabled = false  # Line length
